name: Clean Tide body Fishing CTA implementation

on:
  push:
    branches:
      - "fix/tide-body-fishing-cta"

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, 'Clean Tide body Fishing CTA')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tide-body-fishing-cta
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Remove duplicate CTA definitions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/build_site.py')
          text = path.read_text(encoding='utf-8')

          pattern_start = 'ACTIVITY_PRIMARY_PATTERN = re.compile('
          first = text.index(pattern_start)
          second = text.index(pattern_start, first + 1)
          read_json = text.index('\n\ndef read_json', second)
          text = text[:first] + text[second:read_json] + text[read_json:]

          helper_start = 'def _primary_activity_cta('
          first = text.index(helper_start)
          second = text.index(helper_start, first + 1)
          text = text[:first] + text[second:]

          if text.count(pattern_start) != 1:
              raise SystemExit('expected exactly one ACTIVITY_PRIMARY_PATTERN after cleanup')
          if text.count(helper_start) != 1:
              raise SystemExit('expected exactly one primary CTA helper after cleanup')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Compile source
        run: python -m py_compile src/build_site.py src/test_tide_body_activity_cta.py
      - name: Regenerate final Tide pages
        run: python src/build_site.py
      - name: Run focused regressions
        run: |
          python src/test_tide_body_activity_cta.py
          python src/test_tide_brand_navigation.py
          python src/test_tide_mobile_activity_nav.py
          python src/test_activity_seo_navigation.py
      - name: Install Pinterest test dependency
        run: pip install -r requirements-pinterest.txt
      - name: Run complete regression suite
        run: python -m unittest discover -s src -p "test_*.py"
      - name: Commit cleaned source
        run: |
          git config user.name "coastalnow-bot"
          git config user.email "coastalnow-bot@users.noreply.github.com"
          git add src/build_site.py
          git diff --cached --quiet || git commit -m "Clean Tide Fishing CTA implementation"
          git push
