name: Test raw Tide Fishing CTA

on:
  push:
    branches:
      - "fix/tide-generator-fishing-cta"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tide-generator-fishing-cta
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run raw Tide renderer CTA regression
        run: python src/test_generate_tides_activity_cta.py
