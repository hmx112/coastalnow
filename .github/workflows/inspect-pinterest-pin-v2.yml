name: Inspect Pinterest Pin v2

on:
  push:
    branches:
      - "feat/pinterest-pin-v2"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pinterest-pin-v2
      - name: Upload San Diego v2 images
        uses: actions/upload-artifact@v4
        with:
          name: pinterest-v2-samples
          path: |
            public/pinterest/images/san-diego-tides.png
            public/pinterest/images/san-diego-fishing.png
          if-no-files-found: error
          retention-days: 1
