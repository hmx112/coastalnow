name: Apply Surfing active alert hard stop

on:
  push:
    branches:
      - fix/surfing-active-alert-hard-stop

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/surfing-active-alert-hard-stop
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply current Surfing safety override
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/activities/scoring/surfing_policy.py')
          text = path.read_text()

          hard_stop_anchor = '    "Coastal Flood Warning",\n}'
          hard_stop_replacement = (
              '    "Coastal Flood Warning",\n'
              '    "Small Craft Advisory",\n'
              '    "Rip Current Statement",\n'
              '    "Beach Hazards Statement",\n'
              '}'
          )
          if '    "Beach Hazards Statement",\n}' not in text:
              if hard_stop_anchor not in text:
                  raise SystemExit('Surfing hard-stop anchor not found')
              text = text.replace(hard_stop_anchor, hard_stop_replacement, 1)

          if 'def _active_hard_stop_reasons(' not in text:
              anchor = '\n\ndef _unique_reasons(rows: list[dict]) -> list[str]:\n'
              helper = '''\n\ndef _active_hard_stop_reasons(alerts: list[dict], timestamp: str) -> list[str]:
    reasons: list[str] = []
    for item in alerts:
        if not _alert_active_at(item, timestamp):
            continue
        event = str(item.get("event") or "").strip()
        if event not in SURFING_HARD_STOP_EVENTS:
            continue
        reason = event.lower().replace(" ", "-")
        if reason not in reasons:
            reasons.append(reason)
    return reasons
'''
              if anchor not in text:
                  raise SystemExit('Surfing alert helper anchor not found')
              text = text.replace(anchor, helper + anchor, 1)

          old = '''    return {
        "schema_version": 1,
        "activity": "surfing",
        "location": location["slug"],
        "scorer_version": "surfing-v1",
        "generated_at_utc": now.isoformat(timespec="seconds"),
        "input_snapshot_generated_at_utc": snapshot.get("generated_at_utc"),
        "freshness": freshness,
        "today": _summarize_day(scored_days["today"]),
        "tomorrow": _summarize_day(scored_days["tomorrow"]),
        "hourly": scored_days,
'''
          new = '''    today = _summarize_day(scored_days["today"])
    active_now_reasons = _active_hard_stop_reasons(all_alerts, now.isoformat())
    if active_now_reasons:
        today = {
            "status": "NOT RECOMMENDED",
            "score": None,
            "rating": None,
            "confidence": today.get("confidence") or "Unavailable",
            "best_window": None,
            "ranking_eligible": False,
            "reasons": active_now_reasons,
        }
    tomorrow = _summarize_day(scored_days["tomorrow"])

    return {
        "schema_version": 1,
        "activity": "surfing",
        "location": location["slug"],
        "scorer_version": "surfing-v1",
        "generated_at_utc": now.isoformat(timespec="seconds"),
        "input_snapshot_generated_at_utc": snapshot.get("generated_at_utc"),
        "freshness": freshness,
        "today": today,
        "tomorrow": tomorrow,
        "hourly": scored_days,
'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'active_now_reasons = _active_hard_stop_reasons' not in text:
              raise SystemExit('Surfing today-summary anchor not found')

          path.write_text(text)
          PY
      - name: Run focused regressions
        run: |
          python src/test_surfing_policy.py
          python src/test_activity_current_planning.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/activities/scoring/surfing_policy.py
          git diff --cached --quiet || git commit -m "Prioritize active Surfing safety alerts"
          git push origin HEAD:fix/surfing-active-alert-hard-stop
