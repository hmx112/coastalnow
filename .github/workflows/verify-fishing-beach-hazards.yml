name: Verify Fishing Beach Hazards hard stop

on:
  push:
    branches:
      - fix/fishing-beach-hazards-hard-stop

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python src/test_fishing_safety.py
