name: Test Pinterest RSS automation

on:
  push:
    branches:
      - "feat/pinterest-rss-automation"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pinterest-rss-automation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pinterest image dependency
        run: pip install -r requirements-pinterest.txt
      - name: Run Pinterest catalog schedule tests
        run: python src/test_pinterest_catalog_schedule.py
      - name: Run Pinterest RSS tests
        run: python src/test_pinterest_rss.py
      - name: Run Pinterest render tests
        run: python src/test_pinterest_render.py
      - name: Run Pinterest generator tests
        run: python src/test_pinterest_generation.py
      - name: Run Pinterest workflow contract test
        run: python src/test_pinterest_workflow.py
      - name: Run complete regression suite
        run: python -m unittest discover -s src -p "test_*.py"
      - name: Generate first Pinterest release
        run: python src/generate_pinterest.py --date 2026-08-31
      - name: Commit first Pinterest release
        shell: bash
        run: |
          git config user.name "coastalnow-bot"
          git config user.email "coastalnow-bot@users.noreply.github.com"
          git add public/pinterest
          git diff --cached --quiet || git commit -m "Generate first CoastalNow Pinterest release"
          git push
      - name: Verify clean deterministic regeneration
        shell: bash
        run: |
          python src/generate_pinterest.py --date 2026-08-31
          git diff --exit-code -- public/pinterest
