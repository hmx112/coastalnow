name: Verify Surfing 24-hour forecast

on:
  push:
    branches:
      - feat/surfing-24h-hourly-forecast

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python src/test_surfing_24h_forecast.py
