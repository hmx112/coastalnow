name: Apply Surfing any active alert policy

on:
  push:
    branches:
      - fix/surfing-any-active-alert-hard-stop

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/surfing-any-active-alert-hard-stop
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Make every active NWS alert a Surfing hard stop
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/activities/scoring/surfing_policy.py')
          text = path.read_text()

          old = '''    for item in alerts:
        event = str(item.get("event") or "").strip()
        if event in SURFING_HARD_STOP_EVENTS:
            decision.add_hard_stop(event.lower().replace(" ", "-"))
            continue
        if event == "Dense Fog Advisory":
            decision.add_penalty(15, "dense-fog-advisory")
        elif event == "Coastal Flood Advisory":
            decision.add_cap(59, "coastal-flood-advisory")
'''
          new = '''    for item in alerts:
        event = str(item.get("event") or "").strip()
        if event:
            decision.add_hard_stop(event.lower().replace(" ", "-"))
'''
          if old not in text:
              raise SystemExit('Surfing alert decision block not found')
          text = text.replace(old, new, 1)

          old_helper = '''        event = str(item.get("event") or "").strip()
        if event not in SURFING_HARD_STOP_EVENTS:
            continue
        reason = event.lower().replace(" ", "-")
'''
          new_helper = '''        event = str(item.get("event") or "").strip()
        if not event:
            continue
        reason = event.lower().replace(" ", "-")
'''
          if old_helper not in text:
              raise SystemExit('Surfing active-alert helper block not found')
          text = text.replace(old_helper, new_helper, 1)
          path.write_text(text)
          PY
      - name: Run focused regressions
        run: |
          python src/test_surfing_alert_policy.py
          python src/test_surfing_policy.py
          python src/test_activity_current_planning.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/activities/scoring/surfing_policy.py
          git diff --cached --quiet || git commit -m "Block Surfing scores during any active NWS alert"
          git push origin HEAD:fix/surfing-any-active-alert-hard-stop
