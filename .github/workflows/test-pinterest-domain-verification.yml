name: Test Pinterest domain verification

on:
  push:
    branches:
      - "feat/pinterest-domain-verification"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pinterest-domain-verification
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Pinterest verification regression
        run: python src/test_directory_generation.py
      - name: Regenerate directory pages
        run: python src/build_site.py
      - name: Commit regenerated directory pages
        shell: bash
        run: |
          git config user.name "coastalnow-bot"
          git config user.email "coastalnow-bot@users.noreply.github.com"
          git add public/index.html public/tides/*/index.html
          git diff --cached --quiet || git commit -m "Regenerate directory pages with Pinterest verification"
          git push
