name: Test UI polish

on:
  push:
    branches:
      - "fix/unify-logo-sort-locations"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unify-logo-sort-locations
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild directory and location branding
        run: python src/build_site.py
      - name: Run full regression suite
        run: |
          python src/test_nearby_noaa.py
          python src/test_timezones.py
          python src/test_location_promotion.py
          python src/test_generate_tides.py
          python src/test_directory_generation.py
          python src/test_seo_generation.py
          python src/test_integrated_render.py
          python src/test_san_diego_fixture.py
      - name: Commit rebuilt pages
        run: |
          git config user.name "coastalnow-bot"
          git config user.email "coastalnow-bot@users.noreply.github.com"
          git add public/index.html public/tides/*/index.html public/tides/*/*/index.html
          git diff --cached --quiet || git commit -m "Rebuild pages with unified branding and sorting"
          git push
