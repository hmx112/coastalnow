name: Apply GSC expansion catalog

on:
  push:
    branches:
      - feat/gsc-cluster-expansion
    paths:
      - ".github/workflows/apply-gsc-expansion-catalog.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gsc-cluster-expansion
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Append controlled expansion catalog entries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('src/data/locations.json')
          rows = json.loads(path.read_text(encoding='utf-8'))
          existing = {row['slug'] for row in rows}
          additions = [
            {
              "state":"California","state_code":"CA","state_slug":"california","name":"Long Beach","slug":"long-beach","priority":"B",
              "station_id":None,"latitude":33.7600,"longitude":-118.1890,"timezone":"America/Los_Angeles","datum":"MLLW","units":"english","source":"NOAA/NOS/CO-OPS",
              "activity":{"shore_point":{"latitude":33.7600,"longitude":-118.1890},"marine_point":{"latitude":33.7350,"longitude":-118.2050},"coast_bearing":200}
            },
            {
              "state":"California","state_code":"CA","state_slug":"california","name":"Ventura","slug":"ventura","priority":"B",
              "station_id":None,"latitude":34.2740,"longitude":-119.2990,"timezone":"America/Los_Angeles","datum":"MLLW","units":"english","source":"NOAA/NOS/CO-OPS",
              "activity":{"shore_point":{"latitude":34.2740,"longitude":-119.2990},"marine_point":{"latitude":34.2470,"longitude":-119.3300},"coast_bearing":225}
            },
            {
