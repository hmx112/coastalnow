            },
            {
              "state":"Florida","state_code":"FL","state_slug":"florida","name":"West Palm Beach","slug":"west-palm-beach","priority":"B",
              "station_id":None,"latitude":26.7150,"longitude":-80.0530,"timezone":"America/New_York","datum":"MLLW","units":"english","source":"NOAA/NOS/CO-OPS",
              "activity":{"shore_point":{"latitude":26.7050,"longitude":-80.0340},"marine_point":{"latitude":26.7050,"longitude":-79.9900},"coast_bearing":90}
            },
            {
