              "station_id":None,"latitude":34.4100,"longitude":-119.6900,"timezone":"America/Los_Angeles","datum":"MLLW","units":"english","source":"NOAA/NOS/CO-OPS",
              "activity":{"shore_point":{"latitude":34.4100,"longitude":-119.6900},"marine_point":{"latitude":34.3820,"longitude":-119.7000},"coast_bearing":190}
            },
            {
              "state":"California","state_code":"CA","state_slug":"california","name":"Redondo Beach","slug":"redondo-beach","priority":"B",
              "station_id":None,"latitude":33.8490,"longitude":-118.3990,"timezone":"America/Los_Angeles","datum":"MLLW","units":"english","source":"NOAA/NOS/CO-OPS",
              "activity":{"shore_point":{"latitude":33.8490,"longitude":-118.3990},"marine_point":{"latitude":33.8250,"longitude":-118.4300},"coast_bearing":225}
            },
            {
              "state":"California","state_code":"CA","state_slug":"california","name":"Dana Point","slug":"dana-point","priority":"B",
              "station_id":None,"latitude":33.4610,"longitude":-117.6980,"timezone":"America/Los_Angeles","datum":"MLLW","units":"english","source":"NOAA/NOS/CO-OPS",
              "activity":{"shore_point":{"latitude":33.4610,"longitude":-117.6980},"marine_point":{"latitude":33.4330,"longitude":-117.7240},"coast_bearing":220}
            },
            {
              "state":"California","state_code":"CA","state_slug":"california","name":"Seal Beach","slug":"seal-beach","priority":"B",
              "station_id":None,"latitude":33.7380,"longitude":-118.1090,"timezone":"America/Los_Angeles","datum":"MLLW","units":"english","source":"NOAA/NOS/CO-OPS",
              "activity":{"shore_point":{"latitude":33.7380,"longitude":-118.1090},"marine_point":{"latitude":33.7140,"longitude":-118.1340},"coast_bearing":225}
            },
            {
