            }
          ]
          duplicates = [row['slug'] for row in additions if row['slug'] in existing]
          if duplicates:
              raise SystemExit('Expansion slugs already exist: ' + ', '.join(duplicates))
          rows.extend(additions)
          path.write_text(json.dumps(rows, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Verify catalog additions
        run: |
          python src/test_gsc_expansion_batch.py
          python src/test_location_promotion.py
          python src/test_activity_workflows.py
      - name: Commit catalog additions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/locations.json
          git diff --cached --quiet || git commit -m "Add controlled California and Florida expansion catalog"
          git push origin HEAD:feat/gsc-cluster-expansion
