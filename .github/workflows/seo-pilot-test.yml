name: SEO Pilot Test

on:
  push:
    branches:
      - feat/huntington-seo-pilot
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tide-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Live NOAA configuration
        run: python src/promote_location.py --validate-config

      - name: Render current Live NOAA tide pages for PR verification
        run: |
          set +e
          python src/generate_tides.py
          code=$?
          echo "Tide refresh exit code: $code"
          exit 0

      - name: Generate current Activity data for Tide links
        run: python src/generate_activities.py

      - name: Rebuild directories and SEO artifacts
        run: python src/build_site.py

      - name: Run Tide PR regression tests
        run: |
          python src/test_huntington_seo_pilot.py
          python src/test_malibu_seo_focus.py
          python src/test_generate_tides_activity_cta.py
          python src/test_generate_tides.py
          python src/test_seo_generation.py
          python src/test_activity_end_of_day.py
          python src/test_tide_body_activity_cta.py
          python src/test_tide_refresh_on_main_merge.py
          python src/test_activity_workflows.py
          python src/test_adsense_seo_readiness.py
