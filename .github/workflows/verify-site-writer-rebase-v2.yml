name: Verify site writer rebase v2

on:
  push:
    branches:
      - fix/site-writer-rebase-v2

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python src/test_activity_workflows.py
