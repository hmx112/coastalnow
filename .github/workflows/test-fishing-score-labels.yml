name: Test Fishing score labels

on:
  push:
    branches:
      - "fix/fishing-score-labels"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fishing-score-labels
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Fishing score-label regressions
        run: python src/test_fishing_hub_data_states.py
      - name: Run complete Tide and Activity regression suite
        run: python -m unittest discover -s src -p "test_*.py"
