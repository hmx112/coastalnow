name: Validate Fishing production data

on:
  push:
    branches:
      - "feat/fishing-activity-planner"
    paths:
      - ".github/workflows/validate-fishing-production.yml"

permissions:
  contents: write

concurrency:
  group: fishing-production-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/fishing-activity-planner
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Tide configuration and Activity geography
        run: python src/promote_location.py --validate-config

      - name: Generate all Fishing production condition data
        run: python src/generate_activities.py

      - name: Render Fishing hub, location pages, Tide links and SEO
        run: python src/build_site.py

      - name: Validate all Activity points and report live coverage
        run: python src/validate_activity_network.py

      - name: Run complete regression suite
        run: |
          python src/test_alphanumeric_stations.py
          python src/test_nearby_noaa.py
          python src/test_timezones.py
          python src/test_location_promotion.py
          python src/test_generate_tides.py
          python src/test_directory_generation.py
          python src/test_seo_generation.py
          python src/test_integrated_render.py
          python src/test_san_diego_fixture.py
          python src/test_activity_geography.py
          python src/test_activity_registry.py
          python src/test_activity_conditions.py
          python src/test_nws_duration_parsing.py
          python src/test_activity_collection.py
          python src/test_activity_scoring_engine.py
          python src/test_activity_safety.py
          python src/test_fishing_scoring.py
          python src/test_fishing_safety.py
          python src/test_activity_generation.py
          python src/test_activity_rendering.py
          python src/test_activity_seo_navigation.py
          python src/test_activity_workflows.py
          python src/test_activity_network_validation.py

      - name: Commit generated Fishing production outputs
        shell: bash
        run: |
          git config user.name "coastalnow-bot"
          git config user.email "coastalnow-bot@users.noreply.github.com"
          git add public/data/conditions public/data/activities public/fishing public/tides public/index.html public/sitemap.xml public/robots.txt
          git diff --cached --quiet || git commit -m "Generate Fishing activity production outputs"
          git push origin HEAD:feat/fishing-activity-planner
