name: Test Tide mobile Activity nav

on:
  push:
    branches:
      - "fix/tide-mobile-activity-nav"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tide-mobile-activity-nav
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pinterest test dependency
        run: pip install -r requirements-pinterest.txt
      - name: Run mobile Activity nav regression
        run: python src/test_tide_mobile_activity_nav.py
      - name: Run Tide brand/navigation regressions
        run: python src/test_tide_brand_navigation.py
      - name: Run complete regression suite
        run: python -m unittest discover -s src -p "test_*.py"
