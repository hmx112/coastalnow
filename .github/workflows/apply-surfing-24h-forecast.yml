name: Apply Surfing 24-hour forecast

on:
  push:
    branches:
      - feat/surfing-24h-hourly-forecast

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/surfing-24h-hourly-forecast
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply 24-hour Surfing forecast renderer
        env:
          HOURLY_SECTION_B64: 
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path('src/activities/rendering/surfing_page.py')
          text = path.read_text()
          start = text.index('def _hourly_section(result: dict) -> str:\n')
          end = text.index('\n\ndef _factor_section(result: dict) -> str:\n', start)
          new = base64.b64decode(os.environ['HOURLY_SECTION_B64']).decode()
          path.write_text(text[:start] + new + text[end:])
          PY
      - name: Run focused regressions
        run: |
          python src/test_surfing_24h_forecast.py
          python src/test_surfing_rendering.py
          python src/test_surfing_alert_policy.py
          python src/test_surfing_policy.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/activities/rendering/surfing_page.py
          git diff --cached --quiet || git commit -m "Show next 24 hours in Surfing forecast"
          git push origin HEAD:feat/surfing-24h-hourly-forecast
