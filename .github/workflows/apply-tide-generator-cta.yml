name: Apply raw Tide Fishing CTA

on:
  push:
    branches:
      - "fix/tide-generator-fishing-cta"

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Apply raw Tide Fishing CTA')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tide-generator-fishing-cta
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch raw Tide renderer and template
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('src/generate_tides.py')
          text = source.read_text(encoding='utf-8')

          import_marker = 'from pathlib import Path\nfrom zoneinfo import ZoneInfo\n\nfrom locations import LOCATIONS\n'
          import_replacement = (
              'from pathlib import Path\n'
              'from zoneinfo import ZoneInfo\n\n'
              'from html import escape\n'
              'from activities.registry import enabled_activities\n'
              'from activities.rendering.links import activity_location_url\n'
              'from locations import LOCATIONS\n'
          )
          if import_marker not in text:
              raise SystemExit('generate_tides import marker not found')
          text = text.replace(import_marker, import_replacement, 1)

          helper_marker = 'def static_replacements(location: dict) -> dict:\n'
          helper = '''def primary_activity_cta(location: dict) -> str:\n    configured = {item["slug"]: item for item in enabled_activities()}\n    if "fishing" not in configured:\n        return ""\n    href = escape(activity_location_url(location, "fishing"))\n    location_name = escape(location["name"])\n    return (\n        '<!-- ACTIVITY_PRIMARY_START -->'\n        '<section class="section activity-primary-section">'\n        f'<a class="activity-primary-cta" href="{href}"><div class="info-card">'\n        '<p class="eyebrow">FISHING</p>'\n        f'<h2>Fishing conditions for {location_name}</h2>'\n        '<p>See tide, wind, wave and weather context for shore, pier and nearshore fishing.</p>'\n        '<p><strong>View fishing conditions →</strong></p>'\n        '</div></a></section>'\n        '<!-- ACTIVITY_PRIMARY_END -->'\n    )\n\n\n'''
          if helper_marker not in text:
              raise SystemExit('static_replacements marker not found')
          text = text.replace(helper_marker, helper + helper_marker, 1)

          replacement_marker = '        "HERO_COPY": location["hero_copy"],\n        "TIME_LABEL": location["time_label"],\n'
          replacement_value = (
              '        "HERO_COPY": location["hero_copy"],\n'
              '        "ACTIVITY_PRIMARY_CTA": primary_activity_cta(location),\n'
              '        "TIME_LABEL": location["time_label"],\n'
          )
          if replacement_marker not in text:
              raise SystemExit('static replacement insertion marker not found')
          text = text.replace(replacement_marker, replacement_value, 1)
          source.write_text(text, encoding='utf-8')

          template = Path('src/templates/tide-page.html')
          tpl = template.read_text(encoding='utf-8')
          hero_marker = '  </section>\n\n  <section class="section">\n    <div class="section-head">\n      <div>\n        <p class="eyebrow">AT A GLANCE</p>\n'
          hero_replacement = '  </section>\n\n  {{ACTIVITY_PRIMARY_CTA}}\n\n  <section class="section">\n    <div class="section-head">\n      <div>\n        <p class="eyebrow">AT A GLANCE</p>\n'
          if hero_marker not in tpl:
              raise SystemExit('Tide template hero insertion marker not found')
          tpl = tpl.replace(hero_marker, hero_replacement, 1)
          template.write_text(tpl, encoding='utf-8')
          PY
      - name: Compile source
        run: python -m py_compile src/generate_tides.py src/test_generate_tides_activity_cta.py
      - name: Run raw renderer CTA regression
        run: python src/test_generate_tides_activity_cta.py
      - name: Run existing Tide and Activity regressions
        run: |
          python src/test_generate_tides.py
          python src/test_tide_body_activity_cta.py
          python src/test_tide_brand_navigation.py
          python src/test_tide_mobile_activity_nav.py
          python src/test_activity_seo_navigation.py
      - name: Install Pinterest test dependency
        run: pip install -r requirements-pinterest.txt
      - name: Run complete regression suite
        run: python -m unittest discover -s src -p "test_*.py"
      - name: Commit generator-level fix
        run: |
          git config user.name "coastalnow-bot"
          git config user.email "coastalnow-bot@users.noreply.github.com"
          git add src/generate_tides.py src/templates/tide-page.html
          git diff --cached --quiet || git commit -m "Render Fishing CTA in Tide generator"
          git push
