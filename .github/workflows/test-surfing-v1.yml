name: Test Surfing v1 branch

on:
  push:
    branches:
      - "feat/surfing-v1-pilot"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/surfing-v1-pilot
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: pip install -r requirements-pinterest.txt
      - name: Run focused Surfing implementation tests
        run: |
          python src/test_activity_location_enablement.py
          python src/test_activity_registry.py
          if [ -f src/test_surfing_policy.py ]; then python src/test_surfing_policy.py; fi
          if [ -f src/test_surfing_pilot.py ]; then python src/test_surfing_pilot.py; fi
          if [ -f src/test_surfing_rendering.py ]; then python src/test_surfing_rendering.py; fi
          if [ -f src/test_surfing_navigation.py ]; then python src/test_surfing_navigation.py; fi
          if [ -f src/test_surfing_publication.py ]; then python src/test_surfing_publication.py; fi
      - name: Run complete regression suite during implementation
        continue-on-error: true
        run: python -m unittest discover -s src -p "test_*.py"
