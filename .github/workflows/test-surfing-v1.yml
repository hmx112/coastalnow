name: Validate Surfing v1 pilot

on:
  push:
    branches:
      - "feat/surfing-v1-pilot"

permissions:
  contents: write

jobs:
  validate-and-generate:
    if: ${{ !contains(github.event.head_commit.message, 'Generate Surfing pilot pages') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/surfing-v1-pilot
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: pip install -r requirements-pinterest.txt

      - name: Refresh current data for configured Surfing pilots
        run: |
          PILOTS=$(python - <<'PY'
          from activities.registry import ACTIVITIES
          print(' '.join(ACTIVITIES['surfing']['location_allowlist']))
          PY
          )
          echo "Surfing pilots: $PILOTS"
          for slug in $PILOTS; do
            echo "=== refreshing $slug ==="
            python src/generate_activities.py --location "$slug"
          done

      - name: Validate real Surfing pilot coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          from activities.surfing_pilot import validate_surfing_pilot
          from locations import LOCATIONS

          validated = validate_surfing_pilot(LOCATIONS, Path('public'))
          print('Validated Surfing pilots:', ', '.join(validated))
          if len(validated) != 10:
              raise SystemExit(f'Expected 10 validated pilots, got {len(validated)}')
          PY

      - name: Build full static site
        run: python src/build_site.py

      - name: Assert generated Surfing inventory and links
        run: |
          python - <<'PY'
          from pathlib import Path
          from activities.paths import activity_page_path
          from activities.registry import ACTIVITIES
          from activities.rendering.links import activity_location_url, tide_parent_url
          from locations import LOCATIONS

          root = Path('public')
          pilot = tuple(ACTIVITIES['surfing']['location_allowlist'])
          pilot_set = set(pilot)

          data_files = sorted((root / 'data' / 'activities' / 'surfing').glob('*.json'))
          data_slugs = {path.stem for path in data_files}
          if data_slugs != pilot_set:
              raise SystemExit(f'Surfing JSON mismatch: {sorted(data_slugs)}')

          page_files = sorted((root / 'tides').glob('*/*/surfing/index.html'))
          page_slugs = {path.parts[-3] for path in page_files}
          if page_slugs != pilot_set:
              raise SystemExit(f'Surfing page mismatch: {sorted(page_slugs)}')

          hub = root / 'surfing' / 'index.html'
          if not hub.exists():
              raise SystemExit('Missing Surfing hub')

          for slug in pilot:
              location = LOCATIONS[slug]
              tide_path = root / location['page_path']
              fishing_path = root / activity_page_path(location, 'fishing')
              surfing_path = root / activity_page_path(location, 'surfing')
              for path in (tide_path, fishing_path, surfing_path):
                  if not path.exists():
                      raise SystemExit(f'Missing generated destination: {path}')

              tide_html = tide_path.read_text(encoding='utf-8')
              fishing_html = fishing_path.read_text(encoding='utf-8')
              surfing_html = surfing_path.read_text(encoding='utf-8')
              surf_url = activity_location_url(location, 'surfing')
              fish_url = activity_location_url(location, 'fishing')
              tide_url = tide_parent_url(location)
              if surf_url not in tide_html:
                  raise SystemExit(f'{slug}: Tide page missing Surfing link')
              if surf_url not in fishing_html:
                  raise SystemExit(f'{slug}: Fishing page missing Surfing link')
              if tide_url not in surfing_html or fish_url not in surfing_html:
                  raise SystemExit(f'{slug}: Surfing page missing Tide/Fishing return links')

          for slug, location in LOCATIONS.items():
              if slug in pilot_set:
                  continue
              surf_url = activity_location_url(location, 'surfing')
              tide_path = root / location['page_path']
              if tide_path.exists() and surf_url in tide_path.read_text(encoding='utf-8'):
                  raise SystemExit(f'{slug}: non-pilot Tide page exposes Surfing')
              fishing_path = root / activity_page_path(location, 'fishing')
              if fishing_path.exists() and surf_url in fishing_path.read_text(encoding='utf-8'):
                  raise SystemExit(f'{slug}: non-pilot Fishing page exposes Surfing')

          print('Generated exactly 10 Surfing JSON files and 10 Surfing pages; links verified.')
          PY

      - name: Run full regression suite on generated site
        run: python -m unittest discover -s src -p "test_*.py"

      - name: Show generated diff
        run: |
          git status --short
          git diff --stat

      - name: Stage intentional Surfing rollout outputs
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from activities.paths import activity_data_path, activity_page_path
          from activities.registry import ACTIVITIES
          from locations import LOCATIONS

          paths = [
              'public/index.html',
              'public/sitemap.xml',
              'public/fishing/index.html',
              'public/surfing/index.html',
          ]
          for slug in ACTIVITIES['surfing']['location_allowlist']:
              location = LOCATIONS[slug]
              paths.extend([
                  f'public/data/conditions/{slug}.json',
                  f'public/{activity_data_path(location, "fishing")}',
                  f'public/{activity_data_path(location, "surfing")}',
                  f'public/{location["page_path"]}',
                  f'public/{activity_page_path(location, "fishing")}',
                  f'public/{activity_page_path(location, "surfing")}',
              ])

          existing = [path for path in paths if Path(path).exists()]
          subprocess.run(['git', 'add', '--', *existing], check=True)
          print(f'Staged {len(existing)} intentional rollout files')
          PY
          git diff --cached --stat

      - name: Commit generated Surfing pilot pages
        run: |
          git config user.name "coastalnow-bot"
          git config user.email "coastalnow-bot@users.noreply.github.com"
          git diff --cached --quiet && { echo "No generated changes to commit"; exit 1; }
          git commit -m "Generate Surfing pilot pages"
          git push
