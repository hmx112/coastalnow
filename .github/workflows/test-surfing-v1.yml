name: Test Surfing v1 branch

on:
  push:
    branches:
      - "feat/surfing-v1-pilot"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/surfing-v1-pilot
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply Surfing publication boundary patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          # Inventory boundary: a stale/rogue JSON file for a non-pilot location
          # must never become public merely because it exists on disk.
          path = Path("src/build_site.py")
          text = path.read_text(encoding="utf-8")
          marker = "        for location_slug, location in locations.items():\n            path = public_root / activity_data_path(location, slug)\n"
          replacement = (
              "        for location_slug, location in locations.items():\n"
              "            if not any(item[\"slug\"] == slug for item in enabled_activities_for_location(location)):\n"
              "                continue\n"
              "            path = public_root / activity_data_path(location, slug)\n"
          )
          if marker in text:
              text = text.replace(marker, replacement, 1)
          elif "if not any(item[\"slug\"] == slug for item in enabled_activities_for_location(location))" not in text:
              raise SystemExit("build_site inventory loop marker missing")
          path.write_text(text, encoding="utf-8")

          # Sitemap boundary: defend independently from inventory filtering so a
          # caller cannot accidentally index a non-pilot result dictionary.
          path = Path("src/seo.py")
          text = path.read_text(encoding="utf-8")
          if "from activities.registry import ACTIVITIES, activity_enabled_for_location\n" not in text:
              text = text.replace(
                  "from activities.paths import activity_page_path\n",
                  "from activities.paths import activity_page_path\nfrom activities.registry import ACTIVITIES, activity_enabled_for_location\n",
                  1,
              )
          start = text.find("    if activity_inventory is not None:\n")
          end = text.find("\n    rows =", start)
          if start < 0 or end < 0:
              raise SystemExit("seo activity sitemap block markers missing")
          block = text[start:end]
          if "activity_enabled_for_location(activity, location_slug)" not in block:
              replacement = textwrap.dedent('''\
                  if activity_inventory is not None:
                      for activity_slug, results in activity_inventory.items():
                          activity = ACTIVITIES.get(activity_slug)
                          if not activity or not activity.get("enabled"):
                              continue
                          urls.add(canonical_url(f"{activity_slug}/index.html"))
                          for location_slug, result in results.items():
                              location = locations.get(location_slug)
                              if (
                                  location
                                  and activity_enabled_for_location(activity, location_slug)
                                  and activity_robots_directive(result) == "index,follow"
                              ):
                                  urls.add(canonical_url(activity_page_path(location, activity_slug)))
              ''').rstrip("\n")
              text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding="utf-8")
          PY

      - name: Compile publication modules
        run: python -m py_compile src/build_site.py src/seo.py

      - name: Install test dependency
        run: pip install -r requirements-pinterest.txt

      - name: Run focused Surfing implementation tests
        run: |
          python src/test_activity_location_enablement.py
          python src/test_activity_registry.py
          python src/test_surfing_policy.py
          python src/test_surfing_pilot.py
          python src/test_surfing_rendering.py
          python src/test_surfing_navigation.py
          python src/test_surfing_publication.py
          python src/test_tide_body_activity_cta.py
          python src/test_tide_brand_navigation.py
          python src/test_tide_mobile_activity_nav.py

      - name: Run complete regression suite during implementation
        continue-on-error: true
        run: python -m unittest discover -s src -p "test_*.py"

      - name: Commit publication boundary changes
        run: |
          git config user.name "coastalnow-bot"
          git config user.email "coastalnow-bot@users.noreply.github.com"
          git add src/build_site.py src/seo.py
          git diff --cached --quiet || git commit -m "Publish Surfing pilot in site discovery"
          git push
