name: Verify Surfing daylight hotfix

on:
  push:
    branches:
      - "fix/surfing-daylight-attribution"

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, 'Fix Surfing daylight and attribution') }}
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/surfing-daylight-attribution
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply minimal hotfix
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          # 1) Keep solar events on the requested local calendar day and expose
          # civil aliases expected by existing scoring contracts.
          path = Path('src/activities/conditions/astronomy.py')
          text = path.read_text(encoding='utf-8')
          start = text.find('def _local_event(')
          end = text.find('\n\ndef solar_events', start)
          if start < 0 or end < 0:
              raise SystemExit('astronomy _local_event markers missing')
          replacement = textwrap.dedent('''\
          def _local_event(day: date, latitude: float, longitude: float, tz, *, sunrise: bool, zenith: float):
              utc_hours = _sun_utc_hours(day, latitude, longitude, sunrise=sunrise, zenith=zenith)
              if utc_hours is None:
                  return None
              midnight = datetime.combine(day, time.min, tzinfo=timezone.utc)
              local = (midnight + timedelta(hours=utc_hours)).astimezone(tz)
              # _sun_utc_hours is normalized to 0..24 and therefore loses the UTC
              # day rollover for western longitudes. The function contract is a
              # solar event for the requested *local* day, so restore that day here.
              day_delta = (day - local.date()).days
              return local + timedelta(days=day_delta)
          ''').rstrip('\n')
          text = text[:start] + replacement + text[end:]

          start = text.find('def solar_events(')
          end = text.find('\n\ndef moon_phase_fraction', start)
          if start < 0 or end < 0:
              raise SystemExit('astronomy solar_events markers missing')
          replacement = textwrap.dedent('''\
          def solar_events(day: date, latitude: float, longitude: float, tz) -> dict:
              dawn = _local_event(day, latitude, longitude, tz, sunrise=True, zenith=96.0)
              sunrise = _local_event(day, latitude, longitude, tz, sunrise=True, zenith=90.833)
              sunset = _local_event(day, latitude, longitude, tz, sunrise=False, zenith=90.833)
              dusk = _local_event(day, latitude, longitude, tz, sunrise=False, zenith=96.0)
              return {
                  "dawn": dawn,
                  "civil_dawn": dawn,
                  "sunrise": sunrise,
                  "sunset": sunset,
                  "dusk": dusk,
                  "civil_dusk": dusk,
              }
          ''').rstrip('\n')
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')

          # 2) Read both the historical dawn/dusk keys and the scoring-contract aliases.
          path = Path('src/activities/scoring/surfing_policy.py')
          text = path.read_text(encoding='utf-8')
          old = '    dawn_raw = solar.get("civil_dawn")\n    dusk_raw = solar.get("civil_dusk")\n'
          new = '    dawn_raw = solar.get("civil_dawn") or solar.get("dawn")\n    dusk_raw = solar.get("civil_dusk") or solar.get("dusk")\n'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('surfing daylight key markers missing')
          path.write_text(text, encoding='utf-8')

          # 3) Make source attribution activity-aware while preserving Fishing's
          # existing wording as the default behavior.
          path = Path('src/activities/rendering/attribution.py')
          text = path.read_text(encoding='utf-8')
          start = text.find('def location_attribution_html(')
          end = text.find('\n\ndef hub_attribution_html', start)
          if start < 0 or end < 0:
              raise SystemExit('location attribution markers missing')
          replacement = textwrap.dedent('''\
          def location_attribution_html(location: dict, snapshot: dict, activity_slug: str = "fishing") -> str:
              timezone_name = location.get("timezone") or "UTC"
              forecast_update = _provider_local_time(snapshot, "forecast", timezone_name)
              alert_update = _provider_local_time(snapshot, "alerts", timezone_name)
              tide_update = _provider_local_time(snapshot, "tide", timezone_name)
              updates = []
              if forecast_update:
                  updates.append(f"Forecast: {forecast_update}")
              if alert_update:
                  updates.append(f"Safety alerts: {alert_update}")
              if tide_update:
                  updates.append(f"Tides: {tide_update}")
              update_html = " · ".join(escape(item) for item in updates) or "Source update times unavailable."

              if activity_slug == "surfing":
                  score_line = '<p><strong>Surf Conditions Score &amp; Surf Planning Window:</strong> calculated by CoastalNow from the source data above using published rule-based methodology.</p>'
                  context_line = '<p><strong>Daylight context:</strong> calculated locally by CoastalNow and used as a low-weight planning input.</p>'
                  product_note = 'Surf Conditions Score is a CoastalNow planning metric and is not an official NOAA/NWS product or safety determination. CoastalNow is not affiliated with or endorsed by NOAA or the National Weather Service.'
              else:
                  score_line = '<p><strong>Fishing Score &amp; Best Fishing Time:</strong> calculated by CoastalNow from the source data above using published rule-based methodology.</p>'
                  context_line = '<p><strong>Solar &amp; lunar context:</strong> calculated locally by CoastalNow; lunar influence has low weight and is not presented as a catch guarantee.</p>'
                  product_note = 'Fishing Score is a CoastalNow planning metric and is not an official NOAA/NWS product or safety determination. CoastalNow is not affiliated with or endorsed by NOAA or the National Weather Service.'

              return (
                  '<!-- ACTIVITY_ATTRIBUTION_START -->'
                  '<section class="section activity-panel activity-sources">'
                  '<div class="section-head"><div><p class="eyebrow">TRANSPARENCY</p>'
                  '<h2>Data sources &amp; methodology</h2></div></div>'
                  '<div class="activity-source-list">'
                  f'<p><strong>Tides &amp; water observations:</strong> <a href="{NOAA_COOPS_URL}" rel="noopener">NOAA/NOS/CO-OPS</a>. '
                  f'{escape(_tide_source_text(location))}</p>'
                  f'<p><strong>Weather, wind, waves &amp; alerts:</strong> <a href="{NWS_API_URL}" rel="noopener">NOAA National Weather Service</a>.</p>'
                  + score_line
                  + context_line
                  + '</div>'
                  + f'<p class="meta">{update_html}</p>'
                  + f'<p class="meta">{escape(product_note)}</p>'
                  + f'<a class="card-arrow" href="{METHODOLOGY_URL}">Full Data Sources &amp; Methodology →</a>'
                  + '</section>'
                  + '<!-- ACTIVITY_ATTRIBUTION_END -->'
              )
          ''').rstrip('\n')
          text = text[:start] + replacement + text[end:]

          start = text.find('def hub_attribution_html(')
          end = text.find('\n\ndef inject_attribution', start)
          if start < 0 or end < 0:
              raise SystemExit('hub attribution markers missing')
          replacement = textwrap.dedent('''\
          def hub_attribution_html(activity_slug: str = "fishing") -> str:
              if activity_slug == "surfing":
                  product_note = 'Surf Conditions Scores and planning windows are calculated by CoastalNow. They are not official NOAA/NWS products, safety determinations, or break-specific forecasts.'
              else:
                  product_note = 'Fishing Scores and best-time windows are calculated by CoastalNow. They are not official NOAA/NWS products, safety determinations, or catch predictions.'
              return (
                  '<!-- ACTIVITY_ATTRIBUTION_START -->'
                  '<section class="section activity-panel activity-sources">'
                  '<div class="section-head"><div><p class="eyebrow">TRANSPARENCY</p>'
                  '<h2>Data sources &amp; methodology</h2></div></div>'
                  f'<p>Tide inputs come from <a href="{NOAA_COOPS_URL}" rel="noopener">NOAA/NOS/CO-OPS</a>; weather, wind, wave context and alerts come from the <a href="{NWS_API_URL}" rel="noopener">NOAA National Weather Service</a>.</p>'
                  + f'<p>{escape(product_note)}</p>'
                  + f'<a class="card-arrow" href="{METHODOLOGY_URL}">Full Data Sources &amp; Methodology →</a>'
                  + '</section>'
                  + '<!-- ACTIVITY_ATTRIBUTION_END -->'
              )
          ''').rstrip('\n')
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')

          # 4) Pass the Activity slug through the existing rendering dispatcher.
          path = Path('src/build_site.py')
          text = path.read_text(encoding='utf-8')
          old = 'html = inject_attribution(html, location_attribution_html(location, snapshot))'
          new = 'html = inject_attribution(html, location_attribution_html(location, snapshot, activity_slug=slug))'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('build_site location attribution call missing')
          old = 'hub_html = inject_attribution(hub_html, hub_attribution_html())'
          new = 'hub_html = inject_attribution(hub_html, hub_attribution_html(activity_slug=slug))'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('build_site hub attribution call missing')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Compile hotfix modules
        run: python -m py_compile src/activities/conditions/astronomy.py src/activities/scoring/surfing_policy.py src/activities/rendering/attribution.py src/build_site.py

      - name: Install test dependency
        run: pip install -r requirements-pinterest.txt

      - name: Run hotfix regression tests
        run: |
          python src/test_surfing_daylight_hotfix.py
          python src/test_surfing_attribution_hotfix.py

      - name: Run focused existing Surfing and Fishing tests
        run: |
          python src/test_surfing_policy.py
          python src/test_surfing_rendering.py
          python src/test_surfing_navigation.py
          python src/test_surfing_publication.py
          python src/test_activity_attribution.py 2>/dev/null || true

      - name: Run complete regression suite
        run: python -m unittest discover -s src -p "test_*.py"

      - name: Refresh ten Surfing pilots with corrected astronomy
        run: |
          PILOTS=$(python - <<'PY'
          from activities.registry import ACTIVITIES
          print(' '.join(ACTIVITIES['surfing']['location_allowlist']))
          PY
          )
          for slug in $PILOTS; do
            echo "=== refreshing $slug ==="
            python src/generate_activities.py --location "$slug"
          done
          python src/build_site.py

      - name: Verify regenerated daylight and attribution output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from activities.registry import ACTIVITIES

          root = Path('public')
          pilots = set(ACTIVITIES['surfing']['location_allowlist'])
          surfing_files = {p.stem for p in (root / 'data' / 'activities' / 'surfing').glob('*.json')}
          if surfing_files != pilots:
              raise SystemExit(f'Surfing inventory mismatch: {sorted(surfing_files)}')

          snapshot = json.loads((root / 'data' / 'conditions' / 'san-diego.json').read_text(encoding='utf-8'))
          for label in ('today', 'tomorrow'):
              solar = snapshot['astronomy'][label]
              for key in ('dawn', 'civil_dawn', 'sunrise', 'sunset', 'dusk', 'civil_dusk'):
                  if not solar.get(key):
                      raise SystemExit(f'San Diego {label} missing {key}')
              local_date = solar['dawn'][:10]
              if any(solar[key][:10] != local_date for key in ('sunrise', 'sunset', 'dusk')):
                  raise SystemExit(f'San Diego {label} solar events cross local dates: {solar}')

          surfing = json.loads((root / 'data' / 'activities' / 'surfing' / 'san-diego.json').read_text(encoding='utf-8'))
          if not (surfing.get('hourly') or {}).get('today'):
              raise SystemExit('San Diego Surfing has no hourly rows')
          if any((row.get('components') or {}).get('daylight') is None for row in surfing['hourly']['today']):
              raise SystemExit('San Diego Surfing still has missing daylight components')

          fishing = json.loads((root / 'data' / 'activities' / 'fishing' / 'san-diego.json').read_text(encoding='utf-8'))
          fishing_rows = (fishing.get('hourly') or {}).get('today') or []
          if fishing_rows and any((row.get('components') or {}).get('time_of_day') is None for row in fishing_rows):
              raise SystemExit('San Diego Fishing still has missing time_of_day components')

          surf_html = (root / 'tides' / 'california' / 'san-diego' / 'surfing' / 'index.html').read_text(encoding='utf-8')
          if 'Fishing Score &amp; Best Fishing Time' in surf_html or 'catch guarantee' in surf_html or 'lunar influence' in surf_html:
              raise SystemExit('Surfing page still contains Fishing attribution')
          if 'Surf Conditions Score &amp; Surf Planning Window' not in surf_html or 'Daylight context' not in surf_html:
              raise SystemExit('Surfing-specific attribution missing')
          if '<span>Daylight score</span><strong>—</strong>' in surf_html:
              raise SystemExit('Rendered Surfing page still shows missing Daylight score')

          fish_html = (root / 'tides' / 'california' / 'san-diego' / 'fishing' / 'index.html').read_text(encoding='utf-8')
          if 'Fishing Score &amp; Best Fishing Time' not in fish_html:
              raise SystemExit('Fishing attribution changed unexpectedly')

          hub_html = (root / 'surfing' / 'index.html').read_text(encoding='utf-8')
          if 'Fishing Scores and best-time windows' in hub_html or 'Surf Conditions Scores and planning windows' not in hub_html:
              raise SystemExit('Surfing hub attribution is incorrect')
          print('Regenerated output: daylight and attribution verified for Surfing; Fishing contract preserved.')
          PY

      - name: Stage intentional hotfix outputs
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from activities.paths import activity_data_path, activity_page_path
          from activities.registry import ACTIVITIES
          from locations import LOCATIONS

          paths = [
              'src/activities/conditions/astronomy.py',
              'src/activities/scoring/surfing_policy.py',
              'src/activities/rendering/attribution.py',
              'src/build_site.py',
              'src/test_surfing_daylight_hotfix.py',
              'src/test_surfing_attribution_hotfix.py',
              'public/index.html',
              'public/sitemap.xml',
              'public/fishing/index.html',
              'public/surfing/index.html',
          ]
          for slug in ACTIVITIES['surfing']['location_allowlist']:
              location = LOCATIONS[slug]
              paths.extend([
                  f'public/data/conditions/{slug}.json',
                  f'public/{activity_data_path(location, "fishing")}',
                  f'public/{activity_data_path(location, "surfing")}',
                  f'public/{location["page_path"]}',
                  f'public/{activity_page_path(location, "fishing")}',
                  f'public/{activity_page_path(location, "surfing")}',
              ])
          existing = [path for path in paths if Path(path).exists()]
          subprocess.run(['git', 'add', '--', *existing], check=True)
          print(f'Staged {len(existing)} hotfix files')
          PY
          git diff --cached --stat

      - name: Commit verified hotfix
        run: |
          git config user.name "coastalnow-bot"
          git config user.email "coastalnow-bot@users.noreply.github.com"
          git diff --cached --quiet && { echo "No hotfix changes staged"; exit 1; }
          git commit -m "Fix Surfing daylight and attribution"
          git push
