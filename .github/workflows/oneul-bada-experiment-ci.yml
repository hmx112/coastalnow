name: Oneul Bada isolated test suite

on:
  push:
    branches:
      - experiment/korea-tides-miniapp
    paths:
      - 'korea_miniapp/**'
      - '.github/workflows/oneul-bada-experiment-ci.yml'

concurrency:
  group: oneul-bada-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline KHOA adapter tests (no secrets)
        run: python -m unittest discover -s korea_miniapp -p 'test_*.py' -v
      - name: Cloudflare Worker mock API tests (no secrets)
        run: node --test korea_miniapp/cloud/test_worker.mjs

      - name: Install Apps in Toss SDK/TDS frontend
        working-directory: korea_miniapp/miniapp
        run: npm install --no-audit --no-fund
      - name: Frontend domain tests
        working-directory: korea_miniapp/miniapp
        run: npm run test
      - name: Build production Apps in Toss bundle
        working-directory: korea_miniapp/miniapp
        run: npm run build
