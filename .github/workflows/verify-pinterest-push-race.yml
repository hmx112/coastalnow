name: Verify Pinterest push race fix

on:
  push:
    branches:
      - fix/pinterest-rebase-before-push

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python src/test_pinterest_workflow.py
