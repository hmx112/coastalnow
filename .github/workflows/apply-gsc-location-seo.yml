name: Apply GSC location SEO foundation

on:
  push:
    branches:
      - feat/gsc-seo-foundation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gsc-seo-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply shared location SEO template changes
        run: |
          python - <<'PY'
          from pathlib import Path

          locations = Path('src/locations.py')
          text = locations.read_text(encoding='utf-8')
          old = '''            "page_title": f'{item["name"]} Tide Times Today | CoastalNow',\n            "meta_description": f'{item["name"]} tide times and tide outlook for {item["name"]}, {item["state"]}.',\n'''
          new = '''            "page_title": f'{item["name"]} Tide Times, High & Low Tides Today | CoastalNow',\n            "meta_description": (\n                f'See today’s high tide and low tide times for {item["name"]}, {item["state"]}, '\n                'with a tide chart, 7-day tide schedule, and NOAA source details.'\n            ),\n'''
          if old not in text:
              raise SystemExit('locations metadata anchor not found')
          locations.write_text(text.replace(old, new, 1), encoding='utf-8')

          tides = Path('src/generate_tides.py')
          text = tides.read_text(encoding='utf-8')
          text = text.replace('HUNTINGTON_SEO_PILOT = "huntington-beach"\n', '', 1)
          gate = '''def render_tide_answer(location: dict, data: dict, now: datetime) -> str:\n    if location.get("slug") != HUNTINGTON_SEO_PILOT:\n        return ""\n'''
          if gate not in text:
              raise SystemExit('Huntington answer gate anchor not found')
          text = text.replace(gate, 'def render_tide_answer(location: dict, data: dict, now: datetime) -> str:\n', 1)

          old_nearby = '''def nearby_links(location: dict) -> str:\n    return ''.join(\n        f'<a class="place" href="../{item["slug"]}/index.html">{item["name"]}</a>'\n        for item in location.get("nearby", [])\n    )\n'''
          new_nearby = '''def nearby_links(location: dict) -> str:\n    state_link = (\n        f'<a class="place state-directory-link" href="../index.html">'\n        f'More {location["state"]} tide locations</a>'\n    )\n    neighbors = ''.join(\n        f'<a class="place" href="../{item["slug"]}/index.html">{item["name"]}</a>'\n        for item in location.get("nearby", [])\n    )\n    return state_link + neighbors\n'''
          if old_nearby not in text:
              raise SystemExit('nearby_links anchor not found')
          text = text.replace(old_nearby, new_nearby, 1)

          old_static = '''def static_replacements(location: dict) -> dict:\n    activity_cta = primary_activity_cta(location)\n    is_huntington_pilot = location.get("slug") == HUNTINGTON_SEO_PILOT\n    return {\n'''
          new_static = '''def static_replacements(location: dict) -> dict:\n    activity_cta = primary_activity_cta(location)\n    return {\n'''
          if old_static not in text:
              raise SystemExit('static_replacements anchor not found')
          text = text.replace(old_static, new_static, 1)
          text = text.replace('        "ACTIVITY_PRIMARY_PRE_TIDES": "" if is_huntington_pilot else activity_cta,\n        "ACTIVITY_PRIMARY_POST_TIDES": activity_cta if is_huntington_pilot else "",\n', '        "ACTIVITY_PRIMARY_PRE_TIDES": "",\n        "ACTIVITY_PRIMARY_POST_TIDES": activity_cta,\n', 1)
          tides.write_text(text, encoding='utf-8')

          template = Path('src/templates/tide-page.html')
          text = template.read_text(encoding='utf-8')
          replacements = {
              '<h2>Your next tides</h2>': '<h2>Today’s High and Low Tides</h2>',
              '<h2>Water level through the day</h2>': '<h2>Today’s Tide Chart</h2>',
              '<h2>7-day tide forecast</h2>': '<h2>7-Day Tide Schedule</h2>',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'template heading anchor not found: {old}')
              text = text.replace(old, new, 1)
          template.write_text(text, encoding='utf-8')
          PY
      - name: Normalize generated site artifacts with updated metadata
        run: python src/build_site.py
      - name: Run focused location SEO regressions
        run: |
          python src/test_location_seo_template.py
          python src/test_location_links.py
          python src/test_state_landing.py
          python src/test_seo_generation.py
          python src/test_integrated_render.py
          python src/test_san_diego_fixture.py
          python src/test_tide_forecast_chronology.py
      - name: Commit shared location SEO implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/locations.py src/generate_tides.py src/templates/tide-page.html
          git diff --cached --quiet || git commit -m "Strengthen tide location search intent"
          git push origin HEAD:feat/gsc-seo-foundation
