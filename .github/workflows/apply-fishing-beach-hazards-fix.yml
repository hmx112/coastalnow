name: Apply Fishing Beach Hazards hard stop fix

on:
  push:
    branches:
      - fix/fishing-beach-hazards-hard-stop

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fishing-beach-hazards-hard-stop
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add Beach Hazards Statement to Fishing hard stops
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('src/activities/scoring/fishing.py')
          text = source.read_text()
          old = '    "Flash Flood Warning",\n}'
          new = '    "Flash Flood Warning",\n    "Beach Hazards Statement",\n}'
          if '    "Beach Hazards Statement",\n}' not in text:
              if old not in text:
                  raise SystemExit('Fishing hard-stop set anchor not found')
              source.write_text(text.replace(old, new, 1))

          test = Path('src/test_fishing_safety.py')
          text = test.read_text()
          if '            "Beach Hazards Statement",\n        }' not in text:
              old = '            "Flash Flood Warning",\n        }'
              new = '            "Flash Flood Warning",\n            "Beach Hazards Statement",\n        }'
              if old not in text:
                  raise SystemExit('Fishing safety expected-set anchor not found')
              test.write_text(text.replace(old, new, 1))
          PY
      - name: Verify Fishing safety regression
        run: python src/test_fishing_safety.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/activities/scoring/fishing.py src/test_fishing_safety.py
          git diff --cached --quiet || git commit -m "Treat Beach Hazards Statement as Fishing hard stop"
          git push origin HEAD:fix/fishing-beach-hazards-hard-stop
