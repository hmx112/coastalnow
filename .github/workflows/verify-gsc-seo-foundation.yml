name: Verify GSC SEO foundation

on:
  push:
    branches:
      - feat/gsc-seo-foundation

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Live NOAA configuration and Activity geography
        run: python src/promote_location.py --validate-config
      - name: Fetch NOAA data and render all live tide pages
        run: python src/generate_tides.py
      - name: Render directories, Activity pages, methodology and SEO artifacts
        run: python src/build_site.py
      - name: Run GSC SEO foundation regressions
        run: |
          python src/test_location_links.py
          python src/test_state_landing.py
          python src/test_location_seo_template.py
          python src/test_seo_audit.py
          python src/test_gsc_report.py
          python src/test_directory_generation.py
          python src/test_seo_generation.py
          python src/test_integrated_render.py
          python src/test_san_diego_fixture.py
          python src/test_tide_forecast_chronology.py
          python src/test_activity_workflows.py
      - name: Audit indexed-no-impression and responding Tide pages
        run: |
          python src/seo_audit.py --slugs \
            san-diego cape-hatteras kill-devil-hills myrtle-beach \
            oceanside huntington-beach miami-beach clearwater-beach
