name: Apply GSC expansion Live NOAA config

on:
  push:
    branches:
      - feat/gsc-cluster-expansion
    paths:
      - ".github/workflows/apply-gsc-expansion-live.yml"

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gsc-cluster-expansion
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Revalidate and promote the 12-location batch
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('src').resolve()))
          from promote_location import promote_batch

          items = [
              {"slug":"long-beach","station_id":"9410678","station_name":"Long Beach Fire Boat Pier","prediction_mode":"harmonic","coverage_mode":"local"},
              {"slug":"ventura","station_id":"9411189","station_name":"Ventura","prediction_mode":"hilo-derived","coverage_mode":"local"},
              {"slug":"santa-barbara","station_id":"9411340","station_name":"Santa Barbara","prediction_mode":"harmonic","coverage_mode":"local"},
              {"slug":"redondo-beach","station_id":"9410738","station_name":"King Harbor, Santa Monica Bay","prediction_mode":"hilo-derived","coverage_mode":"local"},
              {"slug":"dana-point","station_id":"9410580","station_name":"Newport Beach, Newport Bay Entrance","prediction_mode":"harmonic","coverage_mode":"nearby-noaa","coverage_distance_miles":14.5},
              {"slug":"seal-beach","station_id":"9410678","station_name":"Long Beach Fire Boat Pier","prediction_mode":"harmonic","coverage_mode":"nearby-noaa","coverage_distance_miles":6.2},
              {"slug":"key-biscayne","station_id":"8723214","station_name":"Virginia Key","prediction_mode":"harmonic","coverage_mode":"nearby-noaa","coverage_distance_miles":2.7},
              {"slug":"west-palm-beach","station_id":"8722670","station_name":"Lake Worth Pier, Atlantic Ocean","prediction_mode":"harmonic","coverage_mode":"nearby-noaa","coverage_distance_miles":7.2},
              {"slug":"fort-myers-beach","station_id":"8725366","station_name":"Matanzas Pass, Estero Island","prediction_mode":"hilo-derived","coverage_mode":"local"},
              {"slug":"pompano-beach","station_id":"8722861","station_name":"Hillsboro Inlet, Inside","prediction_mode":"hilo-derived","coverage_mode":"nearby-noaa","coverage_distance_miles":1.5},
              {"slug":"marco-island","station_id":"8724967","station_name":"Marco Island, Caxambas Pass","prediction_mode":"harmonic","coverage_mode":"local"},
              {"slug":"sarasota","station_id":"8726083","station_name":"Sarasota","prediction_mode":"hilo-derived","coverage_mode":"local"},
          ]
          promote_batch(items, validate_network=True)
          PY
      - name: Verify promoted config
        run: |
          python src/promote_location.py --validate-config
          python src/test_location_promotion.py
          python src/test_gsc_expansion_batch.py
      - name: Commit Live NOAA promotion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/live_noaa.json
          git diff --cached --quiet || git commit -m "Promote validated expansion locations to Live NOAA"
          git push origin HEAD:feat/gsc-cluster-expansion
