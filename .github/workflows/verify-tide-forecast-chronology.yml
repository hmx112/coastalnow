name: Verify chronological 7-day tide forecast

on:
  push:
    branches:
      - feat/tide-forecast-chronological

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python src/test_tide_forecast_chronology.py
