name: Promote location from request

on:
  push:
    branches:
      - "promotion/**"
    paths:
      - "promotion-request/*.json"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: promotion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve promotion request
        id: request
        shell: bash
        run: |
          request=$(git diff-tree --no-commit-id --name-only --diff-filter=AM -r "$GITHUB_SHA"             | grep -E '^promotion-request/[^/]+\.json$'             | head -n 1)
          test -n "$request"
          slug=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["slug"])' "$request")
          echo "path=$request" >> "$GITHUB_OUTPUT"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Validate NOAA and update Live config
        run: python src/promote_location.py "${{ steps.request.outputs.path }}"

      - name: Generate promoted location
        run: python src/generate_tides.py --location "${{ steps.request.outputs.slug }}"

      - name: Rebuild directories
        run: python src/build_site.py

      - name: Run regression tests
        run: |
          python src/test_location_promotion.py
          python src/test_generate_tides.py
          python src/test_directory_generation.py
          python src/test_integrated_render.py
          python src/test_san_diego_fixture.py

      - name: Commit generated promotion
        shell: bash
        run: |
          request="${{ steps.request.outputs.path }}"
          slug="${{ steps.request.outputs.slug }}"
          git config user.name "coastalnow-bot"
          git config user.email "coastalnow-bot@users.noreply.github.com"
          git rm "$request"
          git add src/data/live_noaa.json public/data public/tides public/index.html
          git commit -m "Promote ${slug} to Live NOAA"
          git push origin HEAD

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          SLUG: ${{ steps.request.outputs.slug }}
        shell: bash
        run: |
          if gh pr view "$BRANCH" --json url >/dev/null 2>&1; then
            gh pr view "$BRANCH" --json url
          else
            gh pr create               --base main               --head "$BRANCH"               --title "Promote ${SLUG} to Live NOAA"               --body "NOAA High/Low and 30-minute predictions validated automatically. The request file is removed before the PR, so merging cannot retrigger promotion."
          fi
