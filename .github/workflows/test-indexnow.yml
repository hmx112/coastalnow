name: Test IndexNow integration

on:
  push:
    branches:
      - "feat/indexnow-auto-submit"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/indexnow-auto-submit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run IndexNow tests
        run: python src/test_indexnow.py
      - name: Run complete regression suite
        run: python -m unittest discover -s src -p "test_*.py"
