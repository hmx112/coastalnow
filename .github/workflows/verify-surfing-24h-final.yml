name: Verify Surfing 24-hour final

on:
  push:
    branches:
      - feat/surfing-24h-hourly-forecast

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run final Surfing regressions
        run: |
          python src/test_surfing_24h_forecast.py
          python src/test_surfing_rendering.py
          python src/test_surfing_alert_policy.py
          python src/test_surfing_policy.py
          python src/test_activity_current_planning.py
          python src/test_surfing_hub_sync.py
