name: Test SEO foundation

on:
  push:
    branches:
      - "feat/seo-indexing-foundation"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild site metadata
        run: python src/build_site.py
      - name: Run SEO foundation test
        run: python src/test_seo_generation.py
