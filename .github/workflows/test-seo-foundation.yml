name: Test SEO foundation

on:
  push:
    branches:
      - "feat/seo-indexing-foundation"
    paths:
      - "src/**"
      - ".github/workflows/test-seo-foundation.yml"
      - "docs/superpowers/**"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild site metadata
        run: python src/build_site.py
      - name: Run full regression suite
        run: |
          python src/test_location_promotion.py
          python src/test_generate_tides.py
          python src/test_directory_generation.py
          python src/test_seo_generation.py
          python src/test_integrated_render.py
          python src/test_san_diego_fixture.py
      - name: Commit generated SEO outputs
        run: |
          git config user.name "coastalnow-bot"
          git config user.email "coastalnow-bot@users.noreply.github.com"
          git add public
          git diff --cached --quiet || git commit -m "Rebuild SEO metadata"
          git push
