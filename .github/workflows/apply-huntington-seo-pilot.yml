name: Apply Huntington SEO Pilot

on:
  push:
    branches:
      - feat/huntington-seo-pilot
    paths:
      - "scripts/apply_huntington_seo_pilot.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: feat/huntington-seo-pilot

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply bounded source patch
        run: python scripts/apply_huntington_seo_pilot.py

      - name: Commit source patch and remove one-time helper
        run: |
          git config user.name "coastalnow-bot"
          git config user.email "coastalnow-bot@users.noreply.github.com"
          git add src/generate_tides.py src/templates/tide-page.html
          git rm scripts/apply_huntington_seo_pilot.py .github/workflows/apply-huntington-seo-pilot.yml
          git commit -m "feat: add Huntington Beach answer-first tide pilot"
          git push
