name: Apply Fishing any active alert policy

on:
  push:
    branches:
      - feat/fishing-24h-hourly-forecast

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fishing-24h-hourly-forecast
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply Fishing active-alert hard-stop policy
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/activities/scoring/fishing.py')
          text = path.read_text()

          fn_start = text.index('def fishing_safety_decision(')
          loop_start = text.index('    for item in alerts:\n', fn_start)
          loop_end = text.index('\n    sustained = hour.get("wind_mph")', loop_start)
          new_loop = '''    for item in alerts:\n        event = str(item.get("event") or "").strip()\n        if event:\n            decision.add_hard_stop(event.lower().replace(" ", "-"))\n'''
          text = text[:loop_start] + new_loop + text[loop_end:]

          helper_anchor = '\n\ndef _unique_reasons(rows: list[dict]) -> list[str]:\n'
          helper = '''\n\ndef _active_alert_reasons(alerts: list[dict], timestamp: str) -> list[str]:\n    reasons: list[str] = []\n    for item in alerts:\n        if not _alert_active_at(item, timestamp):\n            continue\n        event = str(item.get("event") or "").strip()\n        if not event:\n            continue\n        reason = event.lower().replace(" ", "-")\n        if reason not in reasons:\n            reasons.append(reason)\n    return reasons\n'''
          if '_active_alert_reasons(' not in text:
              text = text.replace(helper_anchor, helper + helper_anchor, 1)

          old_return = '''    return {\n        "schema_version": 1,\n        "activity": "fishing",\n        "location": location["slug"],\n        "scorer_version": "fishing-v1",\n        "generated_at_utc": now.isoformat(timespec="seconds"),\n        "input_snapshot_generated_at_utc": snapshot.get("generated_at_utc"),\n        "freshness": freshness,\n        "today": _summarize_day(scored_days["today"]),\n        "tomorrow": _summarize_day(scored_days["tomorrow"]),\n        "hourly": scored_days,\n        "scope": "shore / pier / nearshore recreational fishing",\n        "safety_disclaimer": "Fishing Score is a planning metric, not a safety guarantee. Official warnings and local guidance always take priority.",\n    }\n'''
          new_return = '''    today = _summarize_day(scored_days["today"])\n    active_now_reasons = _active_alert_reasons(all_alerts, now.isoformat())\n    if active_now_reasons:\n        today = {\n            "status": "NOT RECOMMENDED",\n            "score": None,\n            "rating": None,\n            "confidence": today.get("confidence") or "Unavailable",\n            "best_window": None,\n            "ranking_eligible": False,\n            "reasons": active_now_reasons,\n        }\n    tomorrow = _summarize_day(scored_days["tomorrow"])\n\n    return {\n        "schema_version": 1,\n        "activity": "fishing",\n        "location": location["slug"],\n        "scorer_version": "fishing-v1",\n        "generated_at_utc": now.isoformat(timespec="seconds"),\n        "input_snapshot_generated_at_utc": snapshot.get("generated_at_utc"),\n        "freshness": freshness,\n        "today": today,\n        "tomorrow": tomorrow,\n        "hourly": scored_days,\n        "scope": "shore / pier / nearshore recreational fishing",\n        "safety_disclaimer": "Fishing Score is a planning metric, not a safety guarantee. Official warnings and local guidance always take priority.",\n    }\n'''
          if old_return not in text:
              raise SystemExit('Fishing result return block not found')
          text = text.replace(old_return, new_return, 1)
          path.write_text(text)

          test_path = Path('src/test_fishing_safety.py')
          test_text = test_path.read_text()
          start = test_text.index('    def test_high_rip_current_risk_is_hard_stop_other_statement_is_strong_cap(self):\n')
          end = test_text.index('\n    def test_wind_safety_boundaries_apply_caps_then_hard_stop(self):\n', start)
          replacement = '''    def test_rip_current_statements_are_hard_stops_under_active_alert_policy(self):\n        for headline in ("HIGH RIP CURRENT RISK", "Rip currents possible"):\n            result = fishing_safety_decision(\n                {"wind_mph": 8, "gust_mph": 10, "wave_height_ft": 2, "wave_period_s": 8, "condition_text": "Clear"},\n                [alert("Rip Current Statement", headline=headline)],\n                coast_bearing=270,\n            ).apply(95)\n            self.assertTrue(result["hard_stop"])\n            self.assertEqual(result["status"], "NOT RECOMMENDED")\n            self.assertIsNone(result["final_score"])\n\n'''
          test_text = test_text[:start] + replacement + test_text[end:]
          test_path.write_text(test_text)
          PY
      - name: Run Fishing regressions
        run: |
          python src/test_fishing_any_alert_policy.py
          python src/test_fishing_safety.py
          python src/test_fishing_24h_forecast.py
          python src/test_activity_rendering.py
          python src/test_fishing_alert_details.py
          python src/test_activity_current_planning.py
          python src/test_activity_end_of_day.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/activities/scoring/fishing.py src/test_fishing_safety.py
          git diff --cached --quiet || git commit -m "Block Fishing scores during active NWS alerts"
          git push origin HEAD:feat/fishing-24h-hourly-forecast
