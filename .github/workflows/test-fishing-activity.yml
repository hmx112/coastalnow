name: Test Fishing activity planner

on:
  push:
    branches:
      - "feat/fishing-activity-planner"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fishing-activity-planner
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Activity geography tests
        run: python src/test_activity_geography.py
      - name: Run Activity registry tests
        run: python src/test_activity_registry.py
      - name: Run Condition Snapshot tests
        run: python src/test_activity_conditions.py
      - name: Run Activity collection tests
        run: python src/test_activity_collection.py
      - name: Run generic Activity scoring tests
        run: python src/test_activity_scoring_engine.py
      - name: Run generic Activity Safety Gate tests
        run: python src/test_activity_safety.py
      - name: Run Fishing quality tests
        run: python src/test_fishing_scoring.py
      - name: Run Fishing Safety Gate tests
        run: python src/test_fishing_safety.py
      - name: Run Activity generation tests
        run: python src/test_activity_generation.py
