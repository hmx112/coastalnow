name: Update San Diego tide data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch NOAA data and render San Diego
        run: python src/update_san_diego.py

      - name: Fetch NOAA data and render Los Angeles
        run: python src/generate_tides.py --location los-angeles

      - name: Render directory pages from location catalog
        run: python src/build_site.py

      - name: Commit refreshed tide data
        run: |
          git config user.name "coastalnow-bot"
          git config user.email "coastalnow-bot@users.noreply.github.com"
          git add public/data/san-diego.json public/data/los-angeles.json public/tides/california/san-diego/index.html public/tides/california/los-angeles/index.html public/index.html public/tides/*/index.html
          git diff --cached --quiet || git commit -m "Update San Diego tide data"
          git push
