name: Update live NOAA tide data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/workflows/update-san-diego.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: coastalnow-site-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Live NOAA configuration and Activity geography
        run: python src/promote_location.py --validate-config

      - name: Fetch NOAA data and render all live tide pages
        id: tide-refresh
        run: |
          set +e
          python src/generate_tides.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Render directories, Activity pages, methodology and SEO artifacts
        run: python src/build_site.py

      - name: Run offline regression tests
        run: |
          python src/test_location_promotion.py
          python src/test_generate_tides.py
          python src/test_directory_generation.py
          python src/test_seo_generation.py
          python src/test_integrated_render.py
          python src/test_san_diego_fixture.py
          python src/test_activity_end_of_day.py
          python src/test_activity_rendering.py
          python src/test_activity_attribution.py
          python src/test_activity_seo_navigation.py
          python src/test_activity_workflows.py
          python src/test_tide_refresh_on_main_merge.py

      - name: Commit refreshed tide data
        run: |
          git config user.name "coastalnow-bot"
          git config user.email "coastalnow-bot@users.noreply.github.com"
          git add public/data public/tides public/fishing public/methodology public/index.html public/sitemap.xml public/robots.txt
          git diff --cached --quiet || git commit -m "Update live NOAA tide data"
          git push

      - name: Report NOAA refresh failures
        if: steps.tide-refresh.outputs.exit_code != '0'
        run: |
          echo "One or more live NOAA locations failed to refresh. Successful/stale outputs were committed above."
          exit 1
