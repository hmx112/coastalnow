name: Test directory banner removal

on:
  push:
    branches:
      - "fix/remove-directory-status-banner"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild directory pages
        run: python src/build_site.py
      - name: Run full regression suite
        run: |
          python src/test_location_promotion.py
          python src/test_generate_tides.py
          python src/test_directory_generation.py
          python src/test_integrated_render.py
          python src/test_san_diego_fixture.py
      - name: Commit rebuilt directory pages
        run: |
          git config user.name "coastalnow-bot"
          git config user.email "coastalnow-bot@users.noreply.github.com"
          git add public/index.html public/tides/*/index.html
          git diff --cached --quiet || git commit -m "Rebuild directory pages [skip ci]"
          git push
