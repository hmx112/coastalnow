name: Test directory banner removal

on:
  push:
    branches:
      - "fix/remove-directory-status-banner"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run directory regression test
        run: python src/test_directory_generation.py
