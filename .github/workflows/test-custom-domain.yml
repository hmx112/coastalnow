name: Test custom domain SEO

on:
  push:
    branches:
      - "feat/custom-domain-coastalnowtides"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/custom-domain-coastalnowtides
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run SEO regression first
        run: python src/test_seo_generation.py
