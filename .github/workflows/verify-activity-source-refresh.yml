name: Verify Activity source refresh

on:
  push:
    branches:
      - fix/activity-refresh-on-source-merge

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python src/test_activity_workflows.py
