name: Verify Fishing all alert relations

on:
  push:
    branches:
      - fix/fishing-all-alert-relations

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python src/test_fishing_alert_details.py
