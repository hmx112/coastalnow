name: Apply Tide mobile Activity nav fix

on:
  push:
    branches:
      - "fix/tide-mobile-activity-nav"

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Apply Tide mobile Activity nav fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tide-mobile-activity-nav
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Normalize legacy Tide mobile nav CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/build_site.py')
          text = path.read_text(encoding='utf-8')
          old = '    html = _inject_activity_nav(html, nav_block)\n\n    block = ""\n'
          new = '''    html = _inject_activity_nav(html, nav_block)
          if nav_block:
              html = html.replace(
                  ".nav>a{display:none}",
                  ".nav>a:not(.activity-nav-link){display:none}",
                  1,
              )

          block = ""
          '''
          import textwrap
          new = textwrap.dedent(new)
          # restore function-body indentation after dedent
          new = ''.join(('    ' + line if line.strip() else line) for line in new.splitlines(keepends=True))
          if old not in text:
              raise SystemExit('build_site Activity-nav insertion point not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Compile
        run: python -m py_compile src/build_site.py
      - name: Run regression
        run: python src/test_tide_mobile_activity_nav.py
      - name: Commit fix
        run: |
          git config user.name "coastalnow-bot"
          git config user.email "coastalnow-bot@users.noreply.github.com"
          git add src/build_site.py
          git commit -m "Keep Tide Activity nav visible on legacy mobile pages"
          git push
