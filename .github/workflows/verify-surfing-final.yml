name: Verify final Surfing pilot

on:
  push:
    branches:
      - "feat/surfing-v1-pilot"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/surfing-v1-pilot
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: pip install -r requirements-pinterest.txt
      - name: Rebuild static site from integrated tree
        run: python src/build_site.py
      - name: Run complete regression suite
        run: python -m unittest discover -s src -p "test_*.py"
      - name: Verify Surfing publication boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          from activities.registry import ACTIVITIES
          from activities.paths import activity_page_path
          from activities.rendering.links import activity_location_url
          from locations import LOCATIONS

          root = Path('public')
          pilots = set(ACTIVITIES['surfing']['location_allowlist'])
          assert len(pilots) == 10, pilots
          data_slugs = {p.stem for p in (root / 'data' / 'activities' / 'surfing').glob('*.json')}
          page_slugs = {p.parts[-3] for p in (root / 'tides').glob('*/*/surfing/index.html')}
          assert data_slugs == pilots, (data_slugs, pilots)
          assert page_slugs == pilots, (page_slugs, pilots)
          assert (root / 'surfing' / 'index.html').exists()
          for slug, location in LOCATIONS.items():
              surf_url = activity_location_url(location, 'surfing')
              tide = root / location['page_path']
              fishing = root / activity_page_path(location, 'fishing')
              surfing = root / activity_page_path(location, 'surfing')
              if slug in pilots:
                  assert surfing.exists(), slug
                  assert surf_url in tide.read_text(encoding='utf-8'), slug
                  assert surf_url in fishing.read_text(encoding='utf-8'), slug
              else:
                  assert not surfing.exists(), slug
                  if tide.exists(): assert surf_url not in tide.read_text(encoding='utf-8'), slug
                  if fishing.exists(): assert surf_url not in fishing.read_text(encoding='utf-8'), slug
          print('Final Surfing boundary verified for 10 pilot locations.')
          PY
