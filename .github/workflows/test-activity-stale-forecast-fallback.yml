name: Test Activity stale forecast fallback

on:
  push:
    branches:
      - fix/activity-stale-forecast-fallback

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -r requirements-pinterest.txt
      - name: Run focused fallback regression
        run: python src/test_activity_stale_forecast_fallback.py
      - name: Run Activity regression suite
        run: |
          python src/test_activity_conditions.py
          python src/test_activity_safety.py
          python src/test_fishing_safety.py
          python src/test_activity_end_of_day.py
          python src/test_activity_generation.py
          python src/test_activity_stale_forecast_fallback.py
          python src/test_activity_rendering.py
          python src/test_activity_attribution.py
          python src/test_activity_seo_navigation.py
          python src/test_activity_workflows.py
      - name: Run full repository test suite
        run: python -m unittest discover -s src -p 'test_*.py'
