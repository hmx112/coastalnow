name: Test Tide body Fishing CTA

on:
  push:
    branches:
      - "fix/tide-body-fishing-cta"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tide-body-fishing-cta
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Tide body CTA regression
        run: python src/test_tide_body_activity_cta.py
