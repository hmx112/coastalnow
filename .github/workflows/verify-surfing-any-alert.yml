name: Verify Surfing any active alert

on:
  push:
    branches:
      - fix/surfing-any-active-alert-hard-stop

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Surfing regressions
        run: |
          python src/test_surfing_alert_policy.py
          python src/test_surfing_policy.py
          python src/test_activity_current_planning.py
          python src/test_surfing_rendering.py
          python src/test_surfing_alert_details.py
          python src/test_surfing_explanation.py
          python src/test_surfing_hub_sync.py
      - name: Verify current Half Moon Bay snapshot
        run: |
          python - <<'PY'
          import json
          import sys
          from datetime import datetime
          from pathlib import Path
          sys.path.insert(0, 'src')
          from activities.scoring.surfing_policy import score_surfing_activity
          from locations import LOCATIONS
          snapshot = json.loads(Path('public/data/conditions/half-moon-bay.json').read_text())
          now = datetime.fromisoformat('2026-09-08T17:37:00-07:00')
          result = score_surfing_activity(snapshot, location=LOCATIONS['half-moon-bay'], now=now)
          today = result['today']
          assert today['status'] == 'NOT RECOMMENDED', today
          assert today['score'] is None, today
          assert today['best_window'] is None, today
          assert today['ranking_eligible'] is False, today
          assert 'heat-advisory' in today['reasons'], today
          print(today)
          PY
