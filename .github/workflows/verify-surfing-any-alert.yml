name: Verify Surfing any active alert

on:
  push:
    branches:
      - fix/surfing-any-active-alert-hard-stop

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python src/test_surfing_alert_policy.py
