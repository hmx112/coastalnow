name: Verify Tide URL baseline hotfix

on:
  push:
    branches:
      - fix/advance-tide-url-baseline

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Live NOAA config
        run: python src/promote_location.py --validate-config
      - name: Generate live Tide pages
        run: python src/generate_tides.py
      - name: Build site
        run: python src/build_site.py
      - name: Run hotfix regressions
        run: |
          python src/test_activity_seo_navigation.py
          python src/test_gsc_expansion_batch.py
          python src/test_seo_generation.py
          python src/test_activity_workflows.py
