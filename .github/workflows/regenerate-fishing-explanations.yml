name: Regenerate Fishing explanation pages

on:
  push:
    branches:
      - "ops/regenerate-fishing-explanations"

permissions:
  contents: write

concurrency:
  group: coastalnow-site-writes
  cancel-in-progress: false

jobs:
  regenerate:
    if: contains(github.event.head_commit.message, 'Trigger Fishing explanation regeneration')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/regenerate-fishing-explanations
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render Activity pages from current stored data
        run: python src/build_site.py
      - name: Verify coherent explanation regression
        run: python src/test_fishing_explanations.py
      - name: Verify old mechanical explanation is absent
        shell: bash
        run: |
          if grep -R "Moving tide supports the fishing window. Winds are light to moderate." public/tides/*/*/fishing/index.html; then
            echo "Old mechanical Fishing explanation found" >&2
            exit 1
          fi
      - name: Commit regenerated Fishing location pages
        shell: bash
        run: |
          git config user.name "coastalnow-bot"
          git config user.email "coastalnow-bot@users.noreply.github.com"
          git add public/tides/*/*/fishing/index.html
          git diff --cached --quiet || git commit -m "Regenerate Fishing explanation pages"
          git push
