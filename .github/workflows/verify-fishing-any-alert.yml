name: Verify Fishing 24-hour final

on:
  push:
    branches:
      - feat/fishing-24h-hourly-forecast

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run final Fishing regressions
        run: |
          python src/test_fishing_any_alert_policy.py
          python src/test_fishing_24h_forecast.py
          python src/test_fishing_safety.py
          python src/test_fishing_scoring.py
          python src/test_fishing_alert_details.py
          python src/test_activity_current_planning.py
          python src/test_activity_end_of_day.py
          python src/test_activity_generation.py
          python src/test_activity_rendering.py
          python src/test_activity_scoring_engine.py
          python src/test_activity_safety.py
          python src/test_activity_workflows.py
