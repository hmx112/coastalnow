<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
<title id="title">Abstract Southern California coastal landscape</title>
<desc id="desc">Decorative illustration of a sunlit coast with ocean, distant hills and layered cliffs.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#cfe8f5"/>
    <stop offset=".58" stop-color="#e9d8b8"/>
    <stop offset="1" stop-color="#7fc6d8"/>
  </linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4aa7bf"/>
    <stop offset=".55" stop-color="#1d799a"/>
    <stop offset="1" stop-color="#0d5876"/>
  </linearGradient>
  <linearGradient id="cliff" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8e825f"/>
    <stop offset=".5" stop-color="#5f6b50"/>
    <stop offset="1" stop-color="#304f46"/>
  </linearGradient>
  <radialGradient id="sun">
    <stop offset="0" stop-color="#fff9d8" stop-opacity=".95"/>
    <stop offset=".35" stop-color="#ffe29d" stop-opacity=".55"/>
    <stop offset="1" stop-color="#ffe29d" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="1600" height="720" fill="url(#sky)"/>
<circle cx="1280" cy="155" r="180" fill="url(#sun)"/>
